name: Build pages and sitemap

# Fires when the homepage or the case study builder changes. The job only ever
# writes generated files, and never index.html or the builder, so its own
# commit cannot re-trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-cases.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so git log can date each page

      - name: Rebuild case study pages
        run: node scripts/build-cases.mjs

      - name: Regenerate sitemap.xml
        run: node scripts/sitemap.mjs

      - name: Commit anything that changed
        run: |
          if git diff --quiet -- sitemap.xml work; then
            echo "generated files already current, nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml work
          git commit -m "Rebuild generated pages [skip ci]"
          git push
