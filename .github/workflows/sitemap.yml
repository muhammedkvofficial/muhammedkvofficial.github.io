name: Sitemap lastmod

# Only fires when the page itself changes. Since the job only ever writes
# sitemap.xml, its own commit cannot re-trigger this workflow.
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so git log can date index.html

      - name: Regenerate sitemap.xml
        run: node scripts/sitemap.mjs

      - name: Commit if the date moved
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap already current, nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap lastmod [skip ci]"
          git push
